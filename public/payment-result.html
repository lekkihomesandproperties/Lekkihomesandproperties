<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status | LEKKIHOMESANDPROPERTIES</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><img src="assets/logo.png" alt="LEKKIHOMESANDPROPERTIES"></a><a class="btn btn-green" href="index.html">Back to home</a></div></header><main class="section"><div class="container" style="max-width:680px"><div class="form-panel"><span class="eyebrow" style="color:#9b7616">Secure payment status</span><h1 style="color:var(--green)">Checking your payment</h1><p id="resultText">Please wait while we verify your transaction with the payment provider.</p><a class="btn btn-green" href="property-listings.html">Browse properties</a></div></div></main><script>const ref=new URLSearchParams(location.search).get('reference')||new URLSearchParams(location.search).get('trxref');const el=document.getElementById('resultText');if(!ref){el.textContent='No payment reference was provided. Please contact our team if you made a payment.'}else fetch('/api/payments/verify/'+encodeURIComponent(ref)).then(async r=>({ok:r.ok,d:await r.json()})).then(({ok,d})=>{el.textContent=ok&&d.status==='paid'?'Payment verified successfully. Reference: '+d.reference+'. Our team can now follow up on your property transaction.':(d.message||'We could not verify this payment. Please contact our team with your payment reference.');}).catch(()=>el.textContent='We could not reach the payment verification service. Please contact our team before retrying payment.');</script></body></html>
